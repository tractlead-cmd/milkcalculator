<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milk Purchase Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#334155;
    --text:#f8fafc;
    --accent:#22c55e;
    --accent2:#16a34a;
    --border:rgba(255,255,255,.08);
}

body.light{
    --bg:#f1f5f9;
    --card:#ffffff;
    --card2:#f8fafc;
    --text:#0f172a;
    --border:rgba(0,0,0,.08);
}

body.light .sticky-navbar {
    background: #f1f5f9;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#111827);
    color:var(--text);
    min-height:100vh;
}

/* STICKY WRAPPER */
.sticky-navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0f172a;
    border-bottom: 1px solid var(--border);
}

/* COMPACT SINGLE-ROW HEADER */
.header{
    padding: 10px 15px;
    backdrop-filter:blur(15px);
    background:rgba(15,23,42,.9);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.header h2{
    margin:0;
    font-size:18px;
    white-space: nowrap;
}

#date{
    opacity:.7;
    font-size:12px;
    white-space: nowrap;
}

.total{
    font-size:22px;
    font-weight:800;
    color:var(--accent);
    text-shadow:0 0 15px rgba(34,197,94,.4);
    white-space: nowrap;
}

/* BUTTONS */
.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding: 8px 15px 12px 15px;
}

.actions button{
    flex:1;
    min-width:100px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 4px 12px rgba(34,197,94,.20);
}

.actions button:hover{
    transform:translateY(-2px);
}

/* SECTIONS - 6 COLUMNS ON ULTRA-WIDE */
.section{
    display:none;
    padding:15px;
    grid-template-columns: repeat(6, 1fr);
    gap: 15px;
}

.section.active{
    display:grid;
}

/* CARDS */
.card{
    background:rgba(30,41,59,.75);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    transition:.25s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card:hover{
    transform:translateY(-3px);
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.row b{
    font-size:17px;
}

.row span{
    font-size:16px;
}

.liters-label {
    font-size: 13px;
    opacity: 0.8;
    font-weight: normal;
}

/* NEW THREE-SLIDE ROW DASHBOARD DESIGN */
.dashboard-row {
    grid-column: 1 / -1;
    background: rgba(30,41,59,.4);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-top: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr; /* Exactly 3 Equal Column Slides */
    gap: 20px;
    align-items: start;
}

.dashboard-slide {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.dashboard-slide h3 {
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.9;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
}

/* LEFT SIDE PANEL: BREAKDOWN LIST */
.liter-list-summary {
    width: 100%;
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.liter-list-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 8px;
    font-size: 14px;
}

body.light .liter-list-item {
    background: rgba(0, 0, 0, 0.04);
}

/* CENTER PANEL: PIE CHART CONTAINER */
.chart-wrapper {
    position: relative;
    width: 100%;
    height: 280px;
    margin: auto;
}

/* RIGHT SIDE PANEL: CUSTOM LEGEND CONTAINER */
.custom-legend-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0;
    margin: 0;
    list-style: none;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    padding: 4px 0;
}

.legend-color-box {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    flex-shrink: 0;
}

/* INPUTS */
input{
    width:100%;
    margin-top:12px;
    margin-bottom:12px;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    outline:none;
    border:2px solid transparent;
    transition:.25s;
}

input:focus{
    border-color:var(--accent);
    box-shadow:0 0 15px rgba(34,197,94,.3);
}

input::placeholder{
    color:#94a3b8;
}

/* CATEGORY TOTAL CARD */
.category-total-card {
    grid-column: 1 / -1;
    background:linear-gradient(
        135deg,
        rgba(34,197,94,.2),
        rgba(22,163,74,.2)
    ) !important;
}

/* BACK TO TOP BUTTON */
.scroll-top-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 50px;
    height: 50px;
    border-radius: 50px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    border: none;
    font-size: 20px;
    cursor: pointer;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(34,197,94, 0.4);
    transition: transform 0.2s;
}

.scroll-top-btn:hover {
    transform: scale(1.1);
}

/* RESPONSIVE BREAKPOINTS */
@media(max-width:1600px){
    .section.active{
        grid-template-columns: repeat(5, 1fr);
    }
}

@media(max-width:1400px){
    .section.active{
        grid-template-columns: repeat(5, 1fr);
    }
}

@media(max-width:1150px){
    .section.active{
        grid-template-columns: repeat(3, 1fr);
    }
    .dashboard-row {
        grid-template-columns: 1fr 1fr; /* Step down to 2 columns if screen tightens */
    }
    .dashboard-slide.legend-slide {
        grid-column: 1 / -1;
    }
    .custom-legend-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }
}

@media(max-width:1024px){
    .section.active{
        grid-template-columns: repeat(2, 1fr);
    }
}

/* MOBILE Layout Conversion */
@media(max-width:768px){
    .header h2{
        font-size:15px;
    }
    
    #date {
        font-size: 11px;
    }

    .total{
        font-size:18px;
    }

    .actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .actions button{
        min-width:unset;
    }

    .section.active{
        grid-template-columns: 1fr;
    }
    
    .dashboard-row {
        grid-template-columns: 1fr; /* Entire stack steps down smoothly */
        gap: 25px;
    }
    
    .custom-legend-list {
        grid-template-columns: repeat(2, 1fr);
    }
}

.hide-btn{
    background:#ef4444;
    padding:6px 10px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    margin-left:10px;
}

.setting-input{
    background:#0f172a;
    color:white;
}

.danger-btn {
    background: #ef4444 !important;
    margin-top: 15px;
}
</style>
</head>
<body>

<div class="sticky-navbar">
    <div class="header">
        <h2>🥛 Milk Calc</h2>
        <div id="date"></div>
        <div class="total" id="grand">₹0.00 | 0.00 L</div>
    </div>

    <div class="actions">
        <button onclick="showTab('milk')">🥛 Milk 1/2 Ltr</button>
        <button onclick="showTab('milk1l')">🥛 Milk 1 Ltr</button>
        <button onclick="showTab('curd')">🍶 Curd</button>
        <button onclick="showTab('p200')">📦 200ML</button>
        <button onclick="showTab('settings')">⚙️ Settings</button>
        <button onclick="toggleTheme()">🌙/☀️</button>
        <button onclick="resetAll()">Reset</button>
        <button onclick="copyTotal()">Copy Total</button>
    </div>
</div>

<div id="milk" class="section active"></div>
<div id="milk1l" class="section"></div>
<div id="curd" class="section"></div>
<div id="p200" class="section"></div>
<div id="settings" class="section"></div>

<button id="scrollTopBtn" class="scroll-top-btn" onclick="scrollToTop()">▲</button>

<script>
// Default complete list of items
const defaultProducts = [
{name:'Orange Milk',price:53,cat:'milk',vol:0.5},
{name:'Blue Milk',price:47,cat:'milk',vol:0.5},
{name:'Green Milk',price:51,cat:'milk',vol:0.5},
{name:'Heritage Milk',price:58,cat:'milk',vol:0.5},
{name:'Family Milk',price:53,cat:'milk',vol:0.5},
{name:'Orange Milk 1L',price:51,cat:'milk1l',vol:1.0},
{name:'Blue Milk 1L',price:46,cat:'milk1l',vol:1.0},
{name:'Nandini Curd',price:54,cat:'curd',vol:0.5},
{name:'Heritage Curd',price:49,cat:'curd',vol:0.5},
{name:'Heritage Milk 200ml',price:8.5,cat:'p200',vol:0.2},
{name:'Heritage Curd 200ml',price:8.5,cat:'p200',vol:0.2},
{name:'Nandini Curd 200ml',price:12.5,cat:'p200',vol:0.2}
];

let products = JSON.parse(localStorage.getItem('products')) || defaultProducts;
let milkPieChart = null; 

// Base color mapping palette built into application matching dashboard aesthetic cleanly
const sliceColors = [
    '#22c55e', '#3b82f6', '#eab308', '#a855f7', 
    '#ec4899', '#f97316', '#06b6d4', '#14b8a6',
    '#6366f1', '#f43f5e', '#10b981', '#84cc16'
];

products.forEach(p => {
    let match = defaultProducts.find(dp => dp.name === p.name);
    if(match) p.vol = match.vol;
});

defaultProducts.forEach(dp => {
    if(!products.find(p => p.name === dp.name)) {
        products.push(dp);
    }
});
localStorage.setItem('products', JSON.stringify(products));

function evalExpr(v){
 if(!v) return 0;
 try{return Function("return "+v)();}catch(e){return 0;}
}

function build(){
 let savedQuantities = JSON.parse(localStorage.getItem('milk_calc_quantities')) || {};

 ['milk','milk1l','curd','p200'].forEach(cat=>{
  let html='';
  products.filter(p=>p.cat===cat).forEach((p)=>{
  let savedVal = savedQuantities[p.name] || '';
  html+=`<div class="card" id="card_${p.name.replaceAll(' ','_')}">
  <div class="row">
  <b>${p.name}</b>
  <div>
  <span>₹${p.price}</span>
  <button class="hide-btn"
  onclick="hideProduct('${p.name.replaceAll(' ','_')}')">
  Hide
  </button>
  </div>
  </div>
   <input data-cat="${cat}" data-name="${p.name}" placeholder="10+12" value="${savedVal}">
   <div class="row">
     <span>Total</span>
     <span style="text-align:right;">
        <span id="t_${p.name.replaceAll(' ','_')}">₹0.00</span><br>
        <small class="liters-label" id="v_${p.name.replaceAll(' ','_')}">0.00 L</small>
     </span>
   </div>
   </div>`;
  });
  let tabTitle = cat === 'milk' ? 'MILK 1/2 LTR' : (cat === 'milk1l' ? 'MILK 1 LTR' : cat.toUpperCase());
  html+=`<div class="card category-total-card"><b>${tabTitle} TOTAL: <span id="${cat}_total">₹0.00</span> <span id="${cat}_vtotal" style="font-weight:normal; font-size:14px; margin-left:10px;">(0.00 L)</span></b></div>`;
  
  // THREE DISTINCT CLASSIFIED SYSTEM GRID ROW SLIDES FOR LAPTOPS/DESKTOPS
  html+=`<div class="dashboard-row">
            <div class="dashboard-slide">
                <h3>📋 Vol Breakdown</h3>
                <ul class="liter-list-summary" id="list_${cat}"></ul>
            </div>
            
            <div class="dashboard-slide">
                <h3>📊 Visual Distribution</h3>
                <div class="chart-wrapper"><canvas id="chart_${cat}"></canvas></div>
            </div>
            
            <div class="dashboard-slide legend-slide">
                <h3>🏷️ Product Index</h3>
                <ul class="custom-legend-list" id="legend_${cat}"></ul>
            </div>
         </div>`;
  
  document.getElementById(cat).innerHTML=html;
 });

 buildSettings();
 attach();
 recalc(false);
}

function attach(){
 const inputs = [...document.querySelectorAll('input:not(.setting-input)')];
 inputs.forEach((inp, idx) => {
  inp.addEventListener('input', () => recalc(true));
  inp.addEventListener('keydown', e => {
   if(e.key === ' ' || e.code === 'Space'){
    e.preventDefault();
    const start = inp.selectionStart;
    const end = inp.selectionEnd;
    const val = inp.value;
    inp.value = val.substring(0, start) + " + " + val.substring(end);
    inp.selectionStart = inp.selectionEnd = start + 3;
    recalc(true);
   }
   if(e.key === 'Enter'){
    e.preventDefault();
    if(inputs[idx + 1]) {
        inputs[idx + 1].focus();
    }
   }
  });
 });
}

function recalc(shouldSave = true){
 let grand=0, grandVol=0;
 let catTotals = { milk: 0, milk1l: 0, curd: 0, p200: 0 };
 let catVols = { milk: 0, milk1l: 0, curd: 0, p200: 0 };
 let quantitiesToSave = {};
 
 // Dynamic trackers used across specific scopes for plotting variables
 let activeBreakdowns = { milk: '', milk1l: '', curd: '', p200: '' };
 let categorySlices = { milk: [], milk1l: [], curd: [], p200: [] };

 document.querySelectorAll('input[data-name]').forEach(inp=>{
   let rawValue = inp.value;
   let name = inp.dataset.name;
   if(rawValue) {
     quantitiesToSave[name] = rawValue;
   }

   let q=evalExpr(rawValue)||0;
   let p=products.find(x=>x.name===name);
   if(p){
     let tot=q*p.price;
     let itemVol = q * (p.vol || 0);
     
     document.getElementById('t_'+p.name.replaceAll(' ','_')).innerText='₹'+tot.toFixed(2);
     document.getElementById('v_'+p.name.replaceAll(' ','_')).innerText=itemVol.toFixed(2) + ' L';
     
     grand+=tot;
     grandVol+=itemVol;
     
     if(catTotals[p.cat] !== undefined){
        catTotals[p.cat] += tot;
        catVols[p.cat] += itemVol;
     }
     
     if (itemVol > 0) {
         // Package distinct item values into structured format
         categorySlices[p.cat].push({ name: p.name, vol: parseFloat(itemVol.toFixed(2)) });
         activeBreakdowns[p.cat] += `<li class="liter-list-item"><b>${p.name}</b> <span>${itemVol.toFixed(2)} L</span></li>`;
     }
   }
 });
 
 document.getElementById('grand').innerText='₹' + grand.toFixed(2) + ' | ' + grandVol.toFixed(2) + ' L';
 
 const activeSection = document.querySelector('.section.active');
 const currentCatId = activeSection ? activeSection.id : 'milk';

 for(let cat in catTotals){
    document.getElementById(cat+'_total').innerText='₹'+catTotals[cat].toFixed(2);
    document.getElementById(cat+'_vtotal').innerText='('+catVols[cat].toFixed(2)+' L)';
    
    let targetList = document.getElementById('list_'+cat);
    if(targetList) {
        targetList.innerHTML = activeBreakdowns[cat] || '<li class="liter-list-item" style="opacity:0.5; justify-content:center;">No quantities configured</li>';
    }
    
    // Build Right end custom description panel with colors matched systematically
    let targetLegend = document.getElementById('legend_'+cat);
    if(targetLegend) {
        let legendHtml = '';
        if(categorySlices[cat].length > 0) {
            categorySlices[cat].forEach((slice, index) => {
                let color = sliceColors[index % sliceColors.length];
                legendHtml += `<li class="legend-item">
                    <div class="legend-color-box" style="background:${color};"></div>
                    <span><b>${slice.name}</b></span>
                </li>`;
            });
        } else {
            legendHtml = '<li class="legend-item" style="opacity:0.5;">No active products</li>';
        }
        targetLegend.innerHTML = legendHtml;
    }
 }

 if(shouldSave) {
    localStorage.setItem('milk_calc_quantities', JSON.stringify(quantitiesToSave));
 }
 
 // Compile unique configurations specifically localized to whatever view context is open right now
 if(currentCatId !== 'settings') {
     let activeLabels = categorySlices[currentCatId].map(s => s.name);
     let activeData = categorySlices[currentCatId].map(s => s.vol);
     updateChart(activeLabels, activeData, currentCatId);
 }
}

function updateChart(labels, data, catId) {
    const canvasId = 'chart_' + catId;
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;

    const isLight = document.body.classList.contains('light');

    if (milkPieChart) {
        milkPieChart.destroy();
    }

    if (labels.length === 0) {
        labels = ['No Entries'];
        data = [0];
    }

    milkPieChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: sliceColors.slice(0, labels.length),
                borderWidth: 1,
                borderColor: isLight ? '#ffffff' : '#1e293b'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false // Turned native legend off to use our custom structural index on the right side
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` ${context.label}: ${context.raw.toFixed(2)} L`;
                        }
                    }
                }
            }
        }
    });
}

function buildSettings(){
 let html='<div class="card"><h3>Price Settings</h3>';
 products.forEach((p,i)=>{
   html+=`
   <div class="row">
      <span>${p.name}</span>
      <input
      class="setting-input"
      id="price_${i}"
      value="${p.price}">
   </div>`;
 });
 html+=`
 <button onclick="savePrices()">Save Prices</button>
 <button class="danger-btn" onclick="clearCache()">Reset App Cache</button>
 </div>`;
 document.getElementById('settings').innerHTML=html;
}

function showTab(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 recalc(false); 
}

function toggleTheme(){
    document.body.classList.toggle('light');
    recalc(false); 
}

function resetAll(){
 if(confirm('Reset all quantities?')){
  document
   .querySelectorAll('input[data-name]')
   .forEach(i=>i.value='');
  localStorage.removeItem('milk_calc_quantities');
  recalc(false);
 }
}

function clearCache(){
 if(confirm('This will restore all default products and configurations. Proceed?')){
  localStorage.removeItem('products');
  localStorage.removeItem('milk_calc_quantities');
  location.reload();
 }
}

function copyTotal(){
 navigator.clipboard.writeText(document.getElementById('grand').innerText);
 alert('Grand total copied');
}

function savePrices(){
 products.forEach((p,i)=>{
   p.price = parseFloat(document.getElementById('price_'+i).value) || 0;
 });
 localStorage.setItem('products', JSON.stringify(products));
 alert('Prices Saved');
 build();
}

function hideProduct(id){
 const card = document.getElementById('card_'+id);
 if(card){
   card.style.display='none';
 }
}

window.onscroll = function() {
    const btn = document.getElementById("scrollTopBtn");
    if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        btn.style.display = "flex";
    } else {
        btn.style.display = "none";
    }
};

function scrollToTop() {
    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

document.getElementById('date').innerText=new Date().toDateString();
build();
</script>
</body>
</html>
