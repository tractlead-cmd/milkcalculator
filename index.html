<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milk Purchase Calculator</title>

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#334155;
    --text:#f8fafc;
    --accent:#22c55e;
    --accent2:#16a34a;
    --border:rgba(255,255,255,.08);
}

body.light{
    --bg:#f1f5f9;
    --card:#ffffff;
    --card2:#f8fafc;
    --text:#0f172a;
    --border:rgba(0,0,0,.08);
}

body.light .sticky-navbar {
    background: #f1f5f9;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#111827);
    color:var(--text);
    min-height:100vh;
}

/* STICKY WRAPPER */
.sticky-navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0f172a;
    border-bottom: 1px solid var(--border);
}

/* COMPACT SINGLE-ROW HEADER */
.header{
    padding: 10px 15px;
    backdrop-filter:blur(15px);
    background:rgba(15,23,42,.9);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.header h2{
    margin:0;
    font-size:18px;
    white-space: nowrap;
}

#date{
    opacity:.7;
    font-size:12px;
    white-space: nowrap;
}

.total{
    font-size:22px;
    font-weight:800;
    color:var(--accent);
    text-shadow:0 0 15px rgba(34,197,94,.4);
    white-space: nowrap;
}

/* BUTTONS */
.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding: 8px 15px 12px 15px;
}

.actions button{
    flex:1;
    min-width:100px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 4px 12px rgba(34,197,94,.20);
}

.actions button:hover{
    transform:translateY(-2px);
}

/* SECTIONS - SET TO 6 COLUMNS NOW */
.section{
    display:none;
    padding:15px;
    grid-template-columns: repeat(6, 1fr);
    gap: 15px;
}

.section.active{
    display:grid;
}

/* CARDS */
.card{
    background:rgba(30,41,59,.75);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    transition:.25s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card:hover{
    transform:translateY(-3px);
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.row b{
    font-size:17px;
}

.row span{
    font-size:16px;
}

/* INPUTS */
input{
    width:100%;
    margin-top:12px;
    margin-bottom:12px;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    outline:none;
    border:2px solid transparent;
    transition:.25s;
}

input:focus{
    border-color:var(--accent);
    box-shadow:0 0 15px rgba(34,197,94,.3);
}

input::placeholder{
    color:#94a3b8;
}

/* CATEGORY TOTAL CARD */
.category-total-card {
    grid-column: 1 / -1;
    background:linear-gradient(
        135deg,
        rgba(34,197,94,.2),
        rgba(22,163,74,.2)
    ) !important;
}

.small{
    font-size:14px;
}

/* BACK TO TOP BUTTON */
.scroll-top-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 50px;
    height: 50px;
    border-radius: 50px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    border: none;
    font-size: 20px;
    cursor: pointer;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(34,197,94, 0.4);
    transition: transform 0.2s;
}

.scroll-top-btn:hover {
    transform: scale(1.1);
}

/* RESPONSIVE BREAKPOINTS MODIFIED FOR 6 COLUMNS */
@media(max-width:1600px){
    .section.active{
        grid-template-columns: repeat(5, 1fr);
    }
}

@media(max-width:1400px){
    .section.active{
        grid-template-columns: repeat(4, 1fr);
    }
}

@media(max-width:1024px){
    .section.active{
        grid-template-columns: repeat(2, 1fr);
    }
}

/* MOBILE */
@media(max-width:768px){
    .header h2{
        font-size:15px;
    }
    
    #date {
        font-size: 11px;
    }

    .total{
        font-size:18px;
    }

    .actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .actions button{
        min-width:unset;
    }

    .section.active{
        grid-template-columns: 1fr;
    }
}

.hide-btn{
    background:#ef4444;
    padding:6px 10px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    margin-left:10px;
}

.setting-input{
    background:#0f172a;
    color:white;
}

.danger-btn {
    background: #ef4444 !important;
    margin-top: 15px;
}
</style>
</head>
<body>

<div class="sticky-navbar">
    <div class="header">
        <h2>🥛 Milk Calc</h2>
        <div id="date"></div>
        <div class="total" id="grand">₹0.00</div>
    </div>

    <div class="actions">
        <button onclick="showTab('milk')">🥛 Milk 1/2 Ltr</button>
        <button onclick="showTab('milk1l')">🥛 Milk 1 Ltr</button>
        <button onclick="showTab('curd')">🍶 Curd</button>
        <button onclick="showTab('p200')">📦 200ML</button>
        <button onclick="showTab('settings')">⚙️ Settings</button>
        <button onclick="toggleTheme()">🌙/☀️</button>
        <button onclick="resetAll()">Reset</button>
        <button onclick="copyTotal()">Copy Total</button>
    </div>
</div>

<div id="milk" class="section active"></div>
<div id="milk1l" class="section"></div>
<div id="curd" class="section"></div>
<div id="p200" class="section"></div>
<div id="settings" class="section"></div>

<button id="scrollTopBtn" class="scroll-top-btn" onclick="scrollToTop()">▲</button>

<script>
// Default complete list of items
const defaultProducts = [
{name:'Orange Milk',price:53,cat:'milk'},
{name:'Family Milk',price:53,cat:'milk'},
{name:'Blue Milk',price:47,cat:'milk'},
{name:'Green Milk',price:51,cat:'milk'},
{name:'Heritage Milk',price:58,cat:'milk'},
{name:'Orange Milk 1L',price:51,cat:'milk1l'},
{name:'Blue Milk 1L',price:46,cat:'milk1l'},
{name:'Nandini Curd',price:54,cat:'curd'},
{name:'Heritage Curd',price:49,cat:'curd'},
{name:'Heritage Milk 200ml',price:8.5,cat:'p200'},
{name:'Heritage Curd 200ml',price:8.5,cat:'p200'},
{name:'Nandini Curd 200ml',price:12.5,cat:'p200'}
];

let products = JSON.parse(localStorage.getItem('products')) || defaultProducts;

// Force inject missing items into saved memory if it's an old save file
defaultProducts.forEach(dp => {
    if(!products.find(p => p.name === dp.name)) {
        products.push(dp);
    }
});
localStorage.setItem('products', JSON.stringify(products));

function evalExpr(v){
 if(!v) return 0;
 try{return Function("return "+v)();}catch(e){return 0;}
}

function build(){
 // Retrieve previously stored input values
 let savedQuantities = JSON.parse(localStorage.getItem('milk_calc_quantities')) || {};

 ['milk','milk1l','curd','p200'].forEach(cat=>{
  let html='';
  products.filter(p=>p.cat===cat).forEach((p)=>{
  let savedVal = savedQuantities[p.name] || '';
  html+=`<div class="card" id="card_${p.name.replaceAll(' ','_')}">
  <div class="row">
  <b>${p.name}</b>
  <div>
  <span>₹${p.price}</span>
  <button class="hide-btn"
  onclick="hideProduct('${p.name.replaceAll(' ','_')}')">
  Hide
  </button>
  </div>
  </div>
   <input data-cat="${cat}" data-name="${p.name}" placeholder="10+12" value="${savedVal}">
   <div class="row"><span>Total</span><span id="t_${p.name.replaceAll(' ','_')}">₹0.00</span></div>
   </div>`;
  });
  let tabTitle = cat === 'milk' ? 'MILK 1/2 LTR' : (cat === 'milk1l' ? 'MILK 1 LTR' : cat.toUpperCase());
  html+=`<div class="card category-total-card"><b>${tabTitle} TOTAL: <span id="${cat}_total">₹0.00</span></b></div>`;
  document.getElementById(cat).innerHTML=html;
 });

 buildSettings();
 attach();
 recalc(false); // Run initial calculation silently without saving redundancy
}

function attach(){
 const inputs = [...document.querySelectorAll('input:not(.setting-input)')];
 inputs.forEach((inp, idx) => {
  inp.addEventListener('input', () => recalc(true));
  inp.addEventListener('keydown', e => {
   // Catch Spacebar and convert it to " + "
   if(e.key === ' ' || e.code === 'Space'){
    e.preventDefault();
    
    const start = inp.selectionStart;
    const end = inp.selectionEnd;
    const val = inp.value;
    
    // Inserts " + " directly at cursor position seamlessly
    inp.value = val.substring(0, start) + " + " + val.substring(end);
    
    // Moves cursor precisely right after the newly inserted tracking pattern
    inp.selectionStart = inp.selectionEnd = start + 3;
    
    recalc(true);
   }
   
   if(e.key === 'Enter'){
    e.preventDefault();
    if(inputs[idx + 1]) {
        inputs[idx + 1].focus();
    }
   }
  });
 });
}

function recalc(shouldSave = true){
 let grand=0,milk=0,milk1l=0,curd=0,p200=0;
 let quantitiesToSave = {};

 document.querySelectorAll('input[data-name]').forEach(inp=>{
   let rawValue = inp.value;
   let name = inp.dataset.name;
   if(rawValue) {
     quantitiesToSave[name] = rawValue;
   }

   let q=evalExpr(rawValue)||0;
   let p=products.find(x=>x.name===name);
   if(p){
     let tot=q*p.price;
     document.getElementById('t_'+p.name.replaceAll(' ','_')).innerText='₹'+tot.toFixed(2);
     grand+=tot;
     if(p.cat==='milk') milk+=tot;
     if(p.cat==='milk1l') milk1l+=tot;
     if(p.cat==='curd') curd+=tot;
     if(p.cat==='p200') p200+=tot;
   }
 });
 
 document.getElementById('grand').innerText='₹'+grand.toFixed(2);
 document.getElementById('milk_total').innerText='₹'+milk.toFixed(2);
 document.getElementById('milk1l_total').innerText='₹'+milk1l.toFixed(2);
 document.getElementById('curd_total').innerText='₹'+curd.toFixed(2);
 document.getElementById('p200_total').innerText='₹'+p200.toFixed(2);

 // Store values dynamically as the user types
 if(shouldSave) {
    localStorage.setItem('milk_calc_quantities', JSON.stringify(quantitiesToSave));
 }
}

function buildSettings(){
 let html='<div class="card"><h3>Price Settings</h3>';
 products.forEach((p,i)=>{
   html+=`
   <div class="row">
      <span>${p.name}</span>
      <input
      class="setting-input"
      id="price_${i}"
      value="${p.price}">
   </div>`;
 });
 html+=`
 <button onclick="savePrices()">Save Prices</button>
 <button class="danger-btn" onclick="clearCache()">Reset App Cache</button>
 </div>`;
 document.getElementById('settings').innerHTML=html;
}

function showTab(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

function toggleTheme(){document.body.classList.toggle('light');}

function resetAll(){
 if(confirm('Reset all quantities?')){
  document
   .querySelectorAll('input[data-name]')
   .forEach(i=>i.value='');
  localStorage.removeItem('milk_calc_quantities'); // Clear saved state data
  recalc(false);
 }
}

function clearCache(){
 if(confirm('This will restore all default products and configurations. Proceed?')){
  localStorage.removeItem('products');
  localStorage.removeItem('milk_calc_quantities');
  location.reload();
 }
}

function copyTotal(){
 navigator.clipboard.writeText(document.getElementById('grand').innerText);
 alert('Grand total copied');
}

function savePrices(){
 products.forEach((p,i)=>{
   p.price =
   parseFloat(
   document.getElementById(
   'price_'+i
   ).value
   ) || 0;
 });
 localStorage.setItem(
 'products',
 JSON.stringify(products)
 );
 alert('Prices Saved');
 build();
}

function hideProduct(id){
 const card = document.getElementById('card_'+id);
 if(card){
   card.style.display='none';
 }
}

window.onscroll = function() {
    const btn = document.getElementById("scrollTopBtn");
    if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        btn.style.display = "flex";
    } else {
        btn.style.display = "none";
    }
};

function scrollToTop() {
    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

document.getElementById('date').innerText=new Date().toDateString();
build();
</script>
</body>
</html>
