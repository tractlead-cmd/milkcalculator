<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milk Purchase Calculator</title>


 <style>
 :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#334155;
    --text:#f8fafc;
    --accent:#22c55e;
    --accent2:#16a34a;
    --border:rgba(255,255,255,.08);
}

body.light{
    --bg:#f1f5f9;
    --card:#ffffff;
    --card2:#f8fafc;
    --text:#0f172a;
    --border:rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#111827);
    color:var(--text);
    min-height:100vh;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:100;
    padding:18px;
    backdrop-filter:blur(15px);
    background:rgba(15,23,42,.9);
    border-bottom:1px solid var(--border);
    text-align:center;
}

.header h2{
    margin:0;
    font-size:28px;
}

#date{
    opacity:.7;
    margin-top:5px;
    font-size:14px;
}

.total{
    font-size:42px;
    font-weight:800;
    color:var(--accent);
    margin-top:10px;
    text-shadow:0 0 20px rgba(34,197,94,.4);
}

/* BUTTONS */

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding:15px;
}

.actions button{
    flex:1;
    min-width:120px;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 4px 15px rgba(34,197,94,.25);
}

.actions button:hover{
    transform:translateY(-3px);
}

/* SECTIONS */

.section{
    display:none;
    padding:15px;
}

.section.active{
    display:block;
}

/* CARDS */

.card{
    background:rgba(30,41,59,.75);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    transition:.25s;
}

.card:hover{
    transform:translateY(-3px);
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.row b{
    font-size:17px;
}

.row span{
    font-size:16px;
}

/* INPUTS */

input{
    width:100%;
    margin-top:12px;
    margin-bottom:12px;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    outline:none;
    border:2px solid transparent;
    transition:.25s;
}

input:focus{
    border-color:var(--accent);
    box-shadow:0 0 15px rgba(34,197,94,.3);
}

input::placeholder{
    color:#94a3b8;
}

/* CATEGORY TOTAL CARD */

.card:last-child{
    background:linear-gradient(
        135deg,
        rgba(34,197,94,.2),
        rgba(22,163,74,.2)
    );
}

.small{
    font-size:14px;
}

/* MOBILE */

@media(max-width:768px){

    .header h2{
        font-size:24px;
    }

    .total{
        font-size:36px;
    }

    .actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .actions button{
        min-width:unset;
    }
}

.hide-btn{
    background:#ef4444;
    padding:6px 10px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    margin-left:10px;
}

.setting-input{
    background:#0f172a;
    color:white;
}

.actions{
    position: sticky;
    top: 110px; /* adjust based on header height */
    z-index: 99;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
}
  
</style>
 
</head>
<body>
<div class="header">
<h2>🥛 Milk Purchase Calculator</h2>
<div id="date"></div>
<div>GRAND TOTAL</div>
<div class="total" id="grand">₹0.00</div>
</div>

<div class="actions">
<button onclick="showTab('milk')">🥛 Milk</button>
<button onclick="showTab('curd')">🍶 Curd</button>
<button onclick="showTab('p200')">📦 200ML</button>
<button onclick="showTab('settings')">⚙️ Settings</button>
<button onclick="toggleTheme()">🌙/☀️</button>
<button onclick="resetAll()">Reset</button>
<button onclick="copyTotal()">Copy Total</button>
</div>

<div id="milk" class="section active"></div>
<div id="curd" class="section"></div>
<div id="p200" class="section"></div>
<div id="settings" class="section"></div>

<script>
let products =
JSON.parse(localStorage.getItem('products')) || [
{name:'Orange Milk',price:53,cat:'milk'},
{name:'Family Milk',price:53,cat:'milk'},
{name:'Blue Milk',price:47,cat:'milk'},
{name:'Green Milk',price:51,cat:'milk'},
{name:'Heritage Milk',price:58,cat:'milk'},
{name:'Nandini Curd',price:54,cat:'curd'},
{name:'Heritage Curd',price:49,cat:'curd'},
{name:'Heritage Milk 200ml',price:8.5,cat:'p200'},
{name:'Heritage Curd 200ml',price:8.5,cat:'p200'},
{name:'Nandini Curd 200ml',price:12.5,cat:'p200'}
];

function evalExpr(v){
 if(!v) return 0;
 try{return Function("return "+v)();}catch(e){return 0;}
}

function build(){
 ['milk','curd','p200'].forEach(cat=>{
  let html='';
  products.filter(p=>p.cat===cat).forEach((p)=>{
  html+=`<div class="card" id="card_${p.name.replaceAll(' ','_')}">
  <div class="row">
  <b>${p.name}</b>
  <div>
  <span>₹${p.price}</span>
  <button class="hide-btn"
  onclick="hideProduct('${p.name.replaceAll(' ','_')}')">
  Hide
  </button>
  </div>
  </div>
   <input data-cat="${cat}" data-name="${p.name}" placeholder="10+12">
   <div class="row"><span>Total</span><span id="t_${p.name}">₹0.00</span></div>
   </div>`;
  });
  html+=`<div class="card"><b>${cat.toUpperCase()} TOTAL: <span id="${cat}_total">₹0.00</span></b></div>`;
  document.getElementById(cat).innerHTML=html;
 });

 buildSettings();
 attach();
}

function attach(){
 const inputs=[...document.querySelectorAll('input')];
 inputs.forEach((inp,idx)=>{
  inp.addEventListener('input',recalc);
  inp.addEventListener('keydown',e=>{
   if(e.key==='Enter'){
    e.preventDefault();
    if(inputs[idx+1]) inputs[idx+1].focus();
   }
  });
 });
}

function recalc(){
 let grand=0,milk=0,curd=0,p200=0;
 document.querySelectorAll('input[data-name]').forEach(inp=>{
   let q=evalExpr(inp.value)||0;
   let p=products.find(x=>x.name===inp.dataset.name);
   let tot=q*p.price;
   document.getElementById('t_'+p.name).innerText='₹'+tot.toFixed(2);
   grand+=tot;
   if(p.cat==='milk') milk+=tot;
   if(p.cat==='curd') curd+=tot;
   if(p.cat==='p200') p200+=tot;
 });
 document.getElementById('grand').innerText='₹'+grand.toFixed(2);
 document.getElementById('milk_total').innerText='₹'+milk.toFixed(2);
 document.getElementById('curd_total').innerText='₹'+curd.toFixed(2);
 document.getElementById('p200_total').innerText='₹'+p200.toFixed(2);
}

function buildSettings(){

 let html='<div class="card"><h3>Price Settings</h3>';

 products.forEach((p,i)=>{
   html+=`
   <div class="row">
      <span>${p.name}</span>
      <input
      class="setting-input"
      id="price_${i}"
      value="${p.price}">
   </div>`;
 });

 html+=`
 <button onclick="savePrices()">
 Save Prices
 </button>
 </div>`;

 document.getElementById('settings').innerHTML=html;
}

function showTab(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function toggleTheme(){document.body.classList.toggle('light');}
function resetAll(){
 if(confirm('Reset all quantities?')){
  document
   .querySelectorAll('input[data-name]')
   .forEach(i=>i.value='');

  recalc();
 }
}
function copyTotal(){
 navigator.clipboard.writeText(document.getElementById('grand').innerText);
 alert('Grand total copied');
}


function savePrices(){

 products.forEach((p,i)=>{
   p.price =
   parseFloat(
   document.getElementById(
   'price_'+i
   ).value
   ) || 0;
 });

 localStorage.setItem(
 'products',
 JSON.stringify(products)
 );

 alert('Prices Saved');

 build();
 recalc();
}

function hideProduct(id){

 const card =
 document.getElementById(
 'card_'+id
 );

 if(card){
   card.style.display='none';
 }
}
document.getElementById('date').innerText=new Date().toDateString();
build();
</script>
</body>
</html>
